version: '3.8'

services:
  web:
    build: .
    container_name: prompts_web
    ports:
      - "5000:5000"
    volumes:
      - sqlite_data:/app/instance
    environment:
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-prod
      - DATABASE_URL=sqlite:///instance/app.db
    restart: always

volumes:
  sqlite_data:
